name: Secret reachability

on:
  push:
    branches: [test/2026-11-13-secret-reachability]
    paths-ignore: ['**.md']
  pull_request:
    branches: [test/2026-11-13-secret-reachability]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions: {}

# Every step only tests whether a secret is empty. No secret value is ever printed.
# An unreachable secret fails its step; later steps still run, so every secret is reported.

jobs:
  # No environment: only repository (and organization) secrets should be there.
  no-environment:
    runs-on: ubuntu-latest
    steps:
      - name: MY_OWN_SECRET (repository)
        env:
          NAME: MY_OWN_SECRET
          REACHABLE: ${{ secrets.MY_OWN_SECRET != '' }}
        run: &check |
          echo "$NAME reachable=$REACHABLE (ref $GITHUB_REF, event $GITHUB_EVENT_NAME)"
          echo "- \`$NAME\` reachable=\`$REACHABLE\` (ref \`$GITHUB_REF\`, event \`$GITHUB_EVENT_NAME\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$REACHABLE" != true ]; then
            echo "::error title=$NAME not reachable::$NAME is empty in job $GITHUB_JOB"
            exit 1
          fi
      - name: MY_OWN_ENVIRONMENTS_SECRET (release environment)
        if: ${{ !cancelled() }}
        env:
          NAME: MY_OWN_ENVIRONMENTS_SECRET
          REACHABLE: ${{ secrets.MY_OWN_ENVIRONMENTS_SECRET != '' }}
        run: *check

  # The release environment only allows main, so this job should never start from a test branch.
  release-environment:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: MY_OWN_ENVIRONMENTS_SECRET (release environment)
        env:
          NAME: MY_OWN_ENVIRONMENTS_SECRET
          REACHABLE: ${{ secrets.MY_OWN_ENVIRONMENTS_SECRET != '' }}
        run: *check
      - name: MY_OWN_SECRET (repository)
        if: ${{ !cancelled() }}
        env:
          NAME: MY_OWN_SECRET
          REACHABLE: ${{ secrets.MY_OWN_SECRET != '' }}
        run: *check

  # Control: an environment that allows this branch, to prove environment secrets do reach a job.
  allowed-environment:
    runs-on: ubuntu-latest
    environment: test-secret-reachability
    steps:
      - name: TEST_ENV_SECRET (test-secret-reachability environment)
        env:
          NAME: TEST_ENV_SECRET
          REACHABLE: ${{ secrets.TEST_ENV_SECRET != '' }}
        run: *check
      - name: MY_OWN_SECRET (repository)
        if: ${{ !cancelled() }}
        env:
          NAME: MY_OWN_SECRET
          REACHABLE: ${{ secrets.MY_OWN_SECRET != '' }}
        run: *check
