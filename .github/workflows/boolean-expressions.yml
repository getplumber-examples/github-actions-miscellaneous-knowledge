name: Boolean expressions

on:
  push:
    branches: [test/2026-11-20-boolean-expressions]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions: {}

# F is the attacker-controlled value. Each step renders the expression twice: inline in the script
# (the pattern ISSUE-207 flags) and through env V (to read the value safely). The inline line is
# `: <value>`, so a payload like $(touch /tmp/injected) runs if it reaches the shell.

jobs:
  commit-message:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Summary header
        run: |
          echo '### Safe forms, F = `github.event.head_commit.message`' >> "$GITHUB_STEP_SUMMARY"
          echo '| Expression | Rendered |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
      - name: "F == '/approve'"
        shell: bash {0}
        env:
          CASE: "F == '/approve'"
          V: "${{ github.event.head_commit.message == '/approve' }}"
        run: |
          rm -f /tmp/injected
          : ${{ github.event.head_commit.message == '/approve' }}
          printf '| `%s` | `%s` |\n' "$CASE" "$(printf %s "$V" | tr '\n|`' " /'")" >> "$GITHUB_STEP_SUMMARY"
          case "$V" in true|false) ;; *) echo "::error::$CASE rendered '$V', not a boolean"; exit 1;; esac
          if [ -e /tmp/injected ]; then echo "::error::$CASE ran the payload"; exit 1; fi
          exit 0
      - name: "F != '/approve'"
        shell: bash {0}
        env:
          CASE: "F != '/approve'"
          V: "${{ github.event.head_commit.message != '/approve' }}"
        run: |
          rm -f /tmp/injected
          : ${{ github.event.head_commit.message != '/approve' }}
          printf '| `%s` | `%s` |\n' "$CASE" "$(printf %s "$V" | tr '\n|`' " /'")" >> "$GITHUB_STEP_SUMMARY"
          case "$V" in true|false) ;; *) echo "::error::$CASE rendered '$V', not a boolean"; exit 1;; esac
          if [ -e /tmp/injected ]; then echo "::error::$CASE ran the payload"; exit 1; fi
          exit 0
      - name: "F < 'm'"
        shell: bash {0}
        env:
          CASE: "F < 'm'"
          V: "${{ github.event.head_commit.message < 'm' }}"
        run: |
          rm -f /tmp/injected
          : ${{ github.event.head_commit.message < 'm' }}
          printf '| `%s` | `%s` |\n' "$CASE" "$(printf %s "$V" | tr '\n|`' " /'")" >> "$GITHUB_STEP_SUMMARY"
          case "$V" in true|false) ;; *) echo "::error::$CASE rendered '$V', not a boolean"; exit 1;; esac
          if [ -e /tmp/injected ]; then echo "::error::$CASE ran the payload"; exit 1; fi
          exit 0
      - name: "F > 'm'"
        shell: bash {0}
        env:
          CASE: "F > 'm'"
          V: "${{ github.event.head_commit.message > 'm' }}"
        run: |
          rm -f /tmp/injected
          : ${{ github.event.head_commit.message > 'm' }}
          printf '| `%s` | `%s` |\n' "$CASE" "$(printf %s "$V" | tr '\n|`' " /'")" >> "$GITHUB_STEP_SUMMARY"
          case "$V" in true|false) ;; *) echo "::error::$CASE rendered '$V', not a boolean"; exit 1;; esac
          if [ -e /tmp/injected ]; then echo "::error::$CASE ran the payload"; exit 1; fi
          exit 0
      - name: "F <= 'm'"
        shell: bash {0}
        env:
          CASE: "F <= 'm'"
          V: "${{ github.event.head_commit.message <= 'm' }}"
        run: |
          rm -f /tmp/injected
          : ${{ github.event.head_commit.message <= 'm' }}
          printf '| `%s` | `%s` |\n' "$CASE" "$(printf %s "$V" | tr '\n|`' " /'")" >> "$GITHUB_STEP_SUMMARY"
          case "$V" in true|false) ;; *) echo "::error::$CASE rendered '$V', not a boolean"; exit 1;; esac
