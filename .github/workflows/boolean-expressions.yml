          if [ -e /tmp/injected ]; then echo "::error::$CASE ran the payload"; exit 1; fi
          exit 0
      - name: "contains(fromJSON('[\"a\",\"b\"]'), F)"
        shell: bash {0}
        env:
          CASE: "contains(fromJSON('[\"a\",\"b\"]'), F)"
          V: "${{ contains(fromJSON('[\"a\",\"b\"]'), github.event.head_commit.message) }}"
        run: |
          rm -f /tmp/injected
          : ${{ contains(fromJSON('["a","b"]'), github.event.head_commit.message) }}
          printf '| `%s` | `%s` |\n' "$CASE" "$(printf %s "$V" | tr '\n|`' " /'")" >> "$GITHUB_STEP_SUMMARY"
