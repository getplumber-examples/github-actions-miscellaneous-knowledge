          : ${{ startsWith(github.event.head_commit.message, 'Test') }}
          printf '| `%s` | `%s` |\n' "$CASE" "$(printf %s "$V" | tr '\n|`' " /'")" >> "$GITHUB_STEP_SUMMARY"
