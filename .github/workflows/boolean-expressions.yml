        run: |
          rm -f /tmp/injected
          : ${{ github.event.head_commit.message >= 'm' }}
          printf '| `%s` | `%s` |\n' "$CASE" "$(printf %s "$V" | tr '\n|`' " /'")" >> "$GITHUB_STEP_SUMMARY"
          case "$V" in true|false) ;; *) echo "::error::$CASE rendered '$V', not a boolean"; exit 1;; esac
