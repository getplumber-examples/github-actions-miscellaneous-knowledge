# Managed by the Plumber platform: onboarding wrote this file and unboarding deletes it.
name: Plumber
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  plumber:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: getplumber/plumber@ec8cb3a7edd6a324b33e85109b627b2df6023d94 # v0.7.23
        with:
          platform: https://demo-github.getplumber.tech
