name: Create issue with top-level contents read

on:
  push:
    branches: [test/2026-10-30-create-issue-with-contents-read]
    paths-ignore: ['**.md']
  workflow_dispatch:

# Set at the top level only: the job has no `permissions` key and inherits this.
permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}
  ISSUE_TITLE: "Test: issue opened by ${{ github.workflow }} run ${{ github.run_id }}"

jobs:
  top-level-contents-read:
    runs-on: ubuntu-latest
    steps:
      - name: Try to open an issue and comment on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          report() {
            {
              echo "### $1"
              echo "exit code: \`$2\`"
              echo '```'
              echo "$3"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }

          out=$(gh issue create --title "$ISSUE_TITLE ($GITHUB_JOB)" \
            --body "Opened by job \`$GITHUB_JOB\` in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" 2>&1)
          rc=$?
          echo "$out"
          report "gh issue create" "$rc" "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=gh issue create failed::$out"
            exit "$rc"
          fi

          number=${out##*/}
          out=$(gh issue comment "$number" --body "Comment written by job \`$GITHUB_JOB\`." 2>&1)
          rc=$?
          echo "$out"
          report "gh issue comment" "$rc" "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=gh issue comment failed::$out"
            exit "$rc"
          fi
