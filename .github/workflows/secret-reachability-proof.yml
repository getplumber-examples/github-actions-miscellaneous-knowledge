# Secret reachability proof — DEFENSIVE DEMO
#
# Demonstrates the core risk behind the "wfx" CI secret-stealer campaign
# (https://www.endorlabs.com/learn/github-actions-supply-chain-attack-targeting-ci-secrets-at-scale):
# a workflow added on ANY branch can reach EVERY repository-level secret.
# The real payload dumps `toJSON(secrets)` and exfiltrates the values.
#
# This workflow is the safe inverse: it NEVER prints a secret value. It prints
# only a boolean — whether each named secret is reachable (non-empty) from this
# branch. That is enough to prove the exposure without leaking anything.
#
# If any secret below prints `reachable=true` from a throwaway branch, that
# secret should be moved behind a GitHub Environment restricted to the default
# branch, so branch/PR workflows can no longer read it.
name: Secret reachability proof

on:
  workflow_dispatch:
  push:
    branches:
      - "demo/**"

# Least privilege: this job needs nothing from the GITHUB_TOKEN.
permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report which secrets are reachable (booleans only, never values)
        env:
          # GITHUB_TOKEN is always injected into a job; it is the attacker's
          # first prize and is shown here to make the point.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add the names of secrets you want to audit. Values are never read
          # into a printable variable — only tested for emptiness below.
          HAS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN != '' }}
          HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
          HAS_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          echo "Secret reachability from branch: ${GITHUB_REF}"
          echo "(true = this branch's workflow can read the secret; value is NOT shown)"
          echo "----------------------------------------------------------------"
          printf '%-28s reachable=%s\n' "GITHUB_TOKEN"            "${HAS_GITHUB_TOKEN}"
          printf '%-28s reachable=%s\n' "DOCKERHUB_TOKEN"         "${HAS_DOCKERHUB_TOKEN}"
          printf '%-28s reachable=%s\n' "NPM_TOKEN"               "${HAS_NPM_TOKEN}"
          printf '%-28s reachable=%s\n' "AWS_ACCESS_KEY_ID"       "${HAS_AWS_ACCESS_KEY_ID}"
          printf '%-28s reachable=%s\n' "RELEASE_APP_PRIVATE_KEY" "${HAS_RELEASE_APP_PRIVATE_KEY}"
          echo "----------------------------------------------------------------"
          echo "Any 'reachable=true' above is readable from this arbitrary branch."
          echo "Mitigation: move that secret behind an Environment scoped to the"
          echo "default branch. See this workflow's header comment for details."
